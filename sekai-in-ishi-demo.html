<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#08111e" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>世界in石｜隕石ワールド デモ</title>
<style>
  :root{--bg:#07101c;--panel:#101d2d;--line:#294159;--ink:#f3f7fb;--muted:#9db0c4;--cyan:#43d6e8;--orange:#ff8d35;--danger:#ff5360}
  *{box-sizing:border-box} html,body{margin:0;background:radial-gradient(circle at 50% -10%,#173050 0,#07101c 52%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;overflow:hidden}
  button,input,select{font:inherit} button{cursor:pointer;color:var(--ink);border:1px solid #3b5874;background:#1a2b40;border-radius:12px;padding:10px 13px;box-shadow:0 3px 0 #09121d;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:none}button.primary{background:linear-gradient(#1bbbd0,#087e9e);border-color:#6be8f1;font-weight:800}button.warn{background:linear-gradient(#e95950,#a9283b);border-color:#ff9180}
  .app{height:100vh;display:flex;flex-direction:column}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #20354c;background:rgba(7,16,28,.86);backdrop-filter:blur(10px);z-index:3}.brand{display:flex;align-items:center;gap:10px}.brand .logo{font-size:27px;filter:drop-shadow(0 0 10px #ff493c)}.brand h1{font-size:19px;margin:0;letter-spacing:.04em}.brand small{display:block;color:#a9bdd0;font-size:11px;font-weight:500;letter-spacing:.1em}.top-actions{display:flex;gap:8px}
  .stage{position:relative;flex:1;min-height:0;overflow:hidden}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:14px;top:14px;padding:9px 12px;background:rgba(7,16,28,.74);border:1px solid #294159;border-radius:12px;font-size:13px;color:#d4e2ee;pointer-events:none}.status{position:absolute;right:14px;top:14px;background:rgba(7,16,28,.78);border:1px solid #294159;border-radius:12px;padding:8px 10px;font-size:12px;color:#bdd0df;pointer-events:none}.population{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(7,16,28,.86);border:1px solid #ffbd65;border-radius:14px;padding:7px 15px;color:#ffe5b0;font-size:15px;font-weight:800;letter-spacing:.04em;pointer-events:none;text-shadow:0 1px 3px #000}.population.extinct{font-family:"Comic Sans MS","Hiragino Maru Gothic ProN","Yu Gothic",cursive;font-size:clamp(42px,33vh,240px);line-height:.9;white-space:nowrap;color:#ff8b82;border-color:#d95b65;letter-spacing:.08em;text-shadow:3px 3px 0 #310c20, -2px -1px 0 #ffb5a6, 0 0 18px #e22f48;transform:translate(-50%,50%) rotate(-3deg);animation:softFlicker 1.8s infinite}@keyframes softFlicker{0%,100%{opacity:1}50%{opacity:.72}}.bottom{display:flex;gap:8px;position:absolute;left:50%;bottom:15px;transform:translateX(-50%);z-index:2;background:rgba(8,17,30,.82);border:1px solid #304b66;padding:8px;border-radius:16px;backdrop-filter:blur(8px)}
  .panel{position:absolute;right:14px;top:66px;width:min(350px,calc(100% - 28px));max-height:calc(100% - 145px);overflow:auto;background:rgba(13,27,43,.96);border:1px solid #3a5874;border-radius:17px;padding:16px;z-index:4;box-shadow:0 15px 50px #0008}.panel[hidden]{display:none}.panel h2{font-size:18px;margin:0 0 5px}.panel p{font-size:12px;line-height:1.55;color:#b2c5d6;margin:5px 0 15px}.close{float:right;background:transparent;border:0;box-shadow:none;padding:2px 5px;font-size:22px;color:#b7cbe0}.group{border-top:1px solid #2a435d;padding-top:12px;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.row label{font-size:13px;color:#d7e6f2}.row input[type=range]{width:150px;accent-color:var(--cyan)}.val{min-width:28px;text-align:right;color:#65e0ed;font-weight:700}.regions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.region{border:1px solid #304c67;border-radius:11px;padding:9px;background:#122338}.region strong{display:block;font-size:13px;margin-bottom:3px}.region label{font-size:11px;color:#aac0d1;display:flex;align-items:center;gap:5px}.region input{width:88px;accent-color:#ff9e4b}
  .legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:#adc1d1;margin-top:10px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.dot.people{background:#ffe3a4}.dot.crater{background:#37b7ca}.dot.danger{background:#f04c3e}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;background:#081421eF;border:1px solid #ff785d;border-radius:17px;padding:14px 18px;text-align:center;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  @media(max-width:600px){.topbar{height:58px}.brand h1{font-size:16px}.top-actions button{padding:8px 9px;font-size:12px}.hint{font-size:11px;max-width:55%}.population{bottom:67px;font-size:13px;padding:6px 10px}.population.extinct{font-size:clamp(36px,27vw,150px)}.bottom{bottom:9px}.bottom button{padding:9px 10px;font-size:12px}.panel{top:60px;max-height:calc(100% - 118px)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="logo">☄️</span><div><h1>世界in石</h1><small>METEOR WORLD / DEMO</small></div></div><div class="top-actions"><button id="peopleBtn">人可視化</button><button id="audioBtn">♫ BGM再生</button><button id="installBtn" hidden>＋インストール</button><button id="settingsBtn">⚙ 設定</button></div></header>
  <main class="stage"><canvas id="world" aria-label="世界地図。タップした場所に隕石を落とせます"></canvas><div class="hint">地図をタップ：隕石を落とす　｜　ドラッグ：地図を動かす　｜　ピンチ：ズーム</div><div class="population" id="population">世界の人口　0人</div><div class="status" id="status">ズーム 100%　人：非表示</div><div class="bottom"><button class="primary" id="resetBtn">↩ 元の世界地図に戻す</button><button id="clearBtn">穴を消す</button></div><div class="toast" id="toast"></div></main>
  <audio id="bgm" src="Quo_Vadis.mp3" loop preload="auto"></audio><audio id="explosionSound" src="爆発1.mp3" preload="auto"></audio>
  <aside class="panel" id="panel" hidden><button class="close" id="closeBtn">×</button><h2>隕石と人の設定</h2><p>小学校中学年でも分かりやすい、実験用の設定です。数字を変えると次に落ちる隕石や表示される人が変わります。</p><div class="group"><div class="row"><label>隕石の大きさ</label><input id="meteorSize" type="range" min="1" max="10" value="5"><span class="val" id="meteorSizeVal">5</span></div><div class="row"><label>隕石のスピード</label><input id="meteorSpeed" type="range" min="1" max="10" value="5"><span class="val" id="meteorSpeedVal">5</span></div><div class="row"><label>人を表示するズーム</label><select id="peopleZoom"><option value="1.35">1/2 地図から</option><option value="1.6" selected>1/4 地図から</option><option value="2.1">1/8 地図から</option></select></div></div><div class="group"><h3 style="font-size:14px;margin:0 0 5px">地域ごとの人口・速さ</h3><p style="margin-bottom:8px">人口10＝土地が人でいっぱい。人の速さはレベル1が旧レベル10、レベル10はレベル1の1万倍です。</p><div class="regions" id="regions"></div></div><div class="legend"><span><i class="dot people"></i>人</span><span><i class="dot crater"></i>海色の穴</span><span><i class="dot danger"></i>衝撃範囲</span></div></aside>
</div>

  function landAt(lon,lat){if(!mapReady)return true;const x=Math.round((lon+180)/360*(mapImageW-1)),y=Math.round((85-lat)/145*(mapImageH-1));if(x<0||x>=mapImageW||y<0||y>=mapImageH)return false;const i=(y*mapImageW+x)*4;return mapPixels[i]<180&&mapPixels[i+1]>100}
  function project(lon,lat){const r=mapRect();return [r.x+((lon+180)/360)*r.w,r.y+((85-lat)/145)*r.h]}
  function drawPoly(points,fill,stroke='#31506b'){ctx.beginPath();points.forEach((p,i)=>{const q=project(p[0],p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
  function drawMap(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b496d');g.addColorStop(.5,'#0b6b83');g.addColorStop(1,'#082b4e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.14;for(let lon=-180;lon<=180;lon+=30){const a=project(lon,-90),b=project(lon,90);ctx.strokeStyle='#b7e8e9';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}for(let lat=-60;lat<=60;lat+=30){const a=project(-180,lat),b=project(180,lat);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}ctx.globalAlpha=1;
    const mr=mapRect(); if(mapReady)ctx.drawImage(mapBuffer,mr.x,mr.y,mr.w,mr.h); else {ctx.fillStyle='#0a5d80';ctx.fillRect(mr.x,mr.y,mr.w,mr.h);}
    craters.forEach(c=>{const q=project(c.lon,c.lat),r=c.radius*zoom;let rg=ctx.createRadialGradient(q[0],q[1],r*.1,q[0],q[1],r);rg.addColorStop(0,'#46d6df');rg.addColorStop(.25,'#218fba');rg.addColorStop(.42,'#e44139');rg.addColorStop(.7,'#f57b2f');rg.addColorStop(1,'#101820');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(q[0],q[1],r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffb03f';ctx.globalAlpha=.65;ctx.stroke();ctx.globalAlpha=1});
    const show=peopleVisible&&zoom>=settings.peopleZoom; if(show) drawPeople();
    meteors.forEach(m=>drawMeteor(m));
  }
  function drawMeteor(m){const target=project(m.lon,m.lat),progress=Math.max(0,Math.min(1,m.t)),approach=1-progress,scale=.18+.98*progress,s=m.size*zoom*scale,travel=Math.max(22,Math.min(W,H)*.32)*approach,q=[target[0]-Math.cos(m.angle)*travel,target[1]-Math.sin(m.angle)*travel];ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(m.angle);ctx.globalAlpha=.45+.55*progress;ctx.fillStyle='#8e001a';ctx.beginPath();ctx.moveTo(-s*.2,0);ctx.lineTo(-s*3,-s*.8);ctx.lineTo(-s*2.1,0);ctx.lineTo(-s*3,s*.8);ctx.lineTo(-s*.2,s*.45);ctx.fill();ctx.fillStyle='#4b4d51';ctx.beginPath();ctx.arc(0,0,s*.72,0,Math.PI*2);ctx.fill();ctx.fillStyle='#090b0f';ctx.beginPath();ctx.arc(s*.25,-s*.2,s*.14,0,Math.PI*2);ctx.arc(s*.05,s*.28,s*.12,0,Math.PI*2);ctx.arc(s*.4,s*.2,s*.22,0,Math.PI*2);ctx.fill();ctx.restore()}
  function regionFor(lon,lat){if(lat>35&&lon>-20&&lon<180)return 'e';if(lat<35&&lat>-36&&lon>-20&&lon<55)return 'af';if(lon<-80&&lat>10)return 'na';if(lon<-35&&lat<15)return 'sa';if(lon>110&&lat<-8)return 'au';return 'is'}
  function regionBounds(id){return {e:[15,175,5,75],af:[-20,55,-35,38],na:[-170,-50,5,75],sa:[-90,-30,-55,15],au:[105,165,-48,-5],is:[-180,180,-55,75]}[id]}
  function randomLand(id){const b=regionBounds(id);for(let tries=0;tries<400;tries++){const lon=b[0]+Math.random()*(b[1]-b[0]),lat=b[2]+Math.random()*(b[3]-b[2]);if(landAt(lon,lat))return [lon,lat]}return [0,0]}
  function seedPeople(){if(!mapReady)return;people=[];regions.forEach(r=>{const n=5+r.pop*5;for(let i=0;i<n;i++){const [lon,lat]=randomLand(r.id);people.push({lon,lat,region:r.id,phase:Math.random()*6.28,state:'walk',rot:0,vy:0,vx:0})}})}
  function drawPeople(){people.forEach(p=>{if(p.state==='gone')return;const q=project(p.lon,p.lat),s=Math.max(2.2,2.2*zoom);ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(p.rot);ctx.strokeStyle=p.state==='fly'?'#ffdfaa':'#ffe9ae';ctx.lineWidth=Math.max(1,zoom*.75);ctx.lineCap='round';ctx.beginPath();ctx.arc(0,-s*1.8,s*.65,0,Math.PI*2);ctx.moveTo(0,-s*1.1);ctx.lineTo(0,s*.8);ctx.moveTo(0,-s*.5);ctx.lineTo(-s*1,s*.1);ctx.moveTo(0,-s*.5);ctx.lineTo(s,s*.1);ctx.moveTo(0,s*.8);ctx.lineTo(-s*.8,s*1.8);ctx.moveTo(0,s*.8);ctx.lineTo(s*.8,s*1.8);ctx.stroke();ctx.restore()})}
  function update(){const now=performance.now(),dt=Math.min(.05,(now-(update.last||now))/1000);update.last=now;meteors.forEach(m=>{m.t+=dt*m.speed;});meteors=meteors.filter(m=>{if(m.t>=1){craters.push({lon:m.lon,lat:m.lat,radius:m.size*2.2});blast(m);return false}return true});people.forEach(p=>{if(p.state==='fly'){p.lon+=p.vx*dt;p.lat+=p.vy*dt;p.vy-=18*dt;p.rot+=dt*8;if(p.vy<-4)p.state='gone'}else if(p.state==='walk'){const r=regions.find(x=>x.id===p.region),oldLon=p.lon,oldLat=p.lat,speed=Math.pow(10000,(r.spd-1)/9),wander=.24*speed;p.lon+=Math.sin(performance.now()/1000+p.phase)*dt*wander;p.lat+=Math.cos(performance.now()/1300+p.phase)*dt*wander*.55;if(!landAt(p.lon,p.lat)){p.lon=oldLon;p.lat=oldLat;p.phase+=1.7}}});drawMap();updateStatus();requestAnimationFrame(update)}
  function blast(m){try{explosionSound.currentTime=0;explosionSound.play().catch(()=>{})}catch(e){}people.forEach(p=>{if(p.state!=='walk')return;const dx=(p.lon-m.lon)*Math.cos(m.lat*Math.PI/180),dy=(p.lat-m.lat),dist=Math.hypot(dx,dy);if(dist<Math.max(5,m.size*1.6)){if(Math.random()<.28)p.state='gone';else{p.state='fly';p.vx=(dx||.2)*1.5;p.vy=7+Math.random()*7;p.rot=(Math.random()-.5)*.8}}});toast('ドーン！　海色の大きな穴があきました');}
  function addMeteor(x,y){const r=mapRect(),lon=((x-r.x)/r.w)*360-180,lat=85-((y-r.y)/r.h)*145;meteors.push({lon,lat,t:0,size:settings.size*2.4+5,speed:.7+settings.speed*.22,angle:Math.atan2(y-(r.y+r.h/2),x-(r.x+r.w/2))+Math.PI});}
  function updateStatus(){const alive=people.filter(p=>p.state!=='gone').length,pop=document.getElementById('population');pop.textContent=alive?`世界の人口　${alive.toLocaleString('ja-JP')}人`:'人類滅亡';pop.classList.toggle('extinct',alive===0);document.getElementById('status').textContent=`ズーム ${Math.round(zoom*100)}%　人：${peopleVisible&&zoom>=settings.peopleZoom?'表示中':'非表示'}`}
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1100)}
  function pointerPos(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  const activePointers=new Map();let gestureMode='none',pinchDistance=0,pinchAnchor=[0,0],pinchStartCenter=[0,0];
  function pointerCenter(){const pts=[...activePointers.values()];return pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length],[0,0])}
  function pointerDistance(){const pts=[...activePointers.values()];return pts.length<2?0:Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1])}
  function geoAtScreen(x,y){const r=mapRect();return [((x-r.x)/r.w)*360-180,85-((y-r.y)/r.h)*145]}
  canvas.addEventListener('pointerdown',e=>{startBgm();const pos=pointerPos(e);activePointers.set(e.pointerId,pos);canvas.setPointerCapture(e.pointerId);if(activePointers.size===1){gestureMode='drag';dragging=true;moved=false;lastX=pos[0];lastY=pos[1]}else if(activePointers.size===2){gestureMode='pinch';moved=true;const c=pointerCenter();pinchStartCenter=c;pinchDistance=pointerDistance();pinchAnchor=geoAtScreen(c[0],c[1])}});
  canvas.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,pointerPos(e));if(activePointers.size>=2&&gestureMode==='pinch'){const c=pointerCenter(),d=pointerDistance();if(pinchDistance>0){zoom=Math.max(.7,Math.min(4,zoom*d/pinchDistance));const q=project(pinchAnchor[0],pinchAnchor[1]);panX+=c[0]-q[0];panY+=c[1]-q[1];pinchDistance=d;pinchAnchor=geoAtScreen(c[0],c[1])}drawMap();return}if(gestureMode==='drag'&&activePointers.size===1){const [x,y]=activePointers.get(e.pointerId),dx=x-lastX,dy=y-lastY;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;panX+=dx;panY+=dy;lastX=x;lastY=y}});
  function endPointer(e){const wasTap=activePointers.size===1&&gestureMode==='drag'&&!moved;const pos=activePointers.get(e.pointerId)||pointerPos(e);activePointers.delete(e.pointerId);if(wasTap)addMeteor(pos[0],pos[1]);if(activePointers.size===1){gestureMode='drag';moved=true;const p=[...activePointers.values()][0];lastX=p[0];lastY=p[1]}else if(activePointers.size===0){gestureMode='none';dragging=false}}
  canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(4,zoom*(e.deltaY<0?1.12:.89)));drawMap()},{passive:false});
  document.getElementById('resetBtn').onclick=()=>{startBgm();zoom=1;panX=0;panY=0;craters=[];meteors=[];people.forEach(p=>{p.state='walk';p.rot=0});toast('元の世界地図に戻りました')};document.getElementById('clearBtn').onclick=()=>{craters=[];toast('穴を消しました')};document.getElementById('peopleBtn').onclick=()=>{startBgm();peopleVisible=!peopleVisible;document.getElementById('peopleBtn').textContent=peopleVisible?'人を非表示':'人可視化';toast(peopleVisible?'人が見えるようになりました（ズームしてね）':'人を隠しました')};audioBtn.onclick=toggleBgm;
  let deferredInstallPrompt=null;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.hidden=true};window.addEventListener('appinstalled',()=>{installBtn.hidden=true;toast('ホーム画面に追加しました')});
  const panel=document.getElementById('panel');document.getElementById('settingsBtn').onclick=()=>panel.hidden=false;document.getElementById('closeBtn').onclick=()=>panel.hidden=true;
  function bindRange(id,key){const el=document.getElementById(id),v=document.getElementById(id+'Val');el.oninput=()=>{settings[key]=+el.value;v.textContent=el.value}}bindRange('meteorSize','size');bindRange('meteorSpeed','speed');document.getElementById('peopleZoom').onchange=e=>settings.peopleZoom=+e.target.value;
  document.getElementById('regions').innerHTML=regions.map(r=>`<div class="region"><strong>${r.name}</strong><label>人口 <input type="range" min="1" max="10" value="${r.pop}" data-r="${r.id}" data-k="pop"><b>${r.pop}</b></label><label>速さ <input type="range" min="1" max="10" value="${r.spd}" data-r="${r.id}" data-k="spd"><b>${r.spd}</b></label></div>`).join('');document.querySelectorAll('.region input').forEach(el=>el.oninput=()=>{const r=regions.find(x=>x.id===el.dataset.r);r[el.dataset.k]=+el.value;el.nextElementSibling.textContent=el.value;seedPeople()});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  requestAnimationFrame(update);
})();
</script>
